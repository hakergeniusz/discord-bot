name: Container

on:
  push:
    branches: ["main", "latest"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: discord-bot

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners where available; riscv64 rides QEMU emulation.
          # riscv64 builds from source (cffi/pynacl/cryptography); needs 180 min.
          - platform: linux/amd64
            runs-on: ubuntu-latest
            emulate: false
            timeout: 60
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            emulate: false
            timeout: 60
          - platform: linux/riscv64
            runs-on: ubuntu-latest
            emulate: true
            timeout: 180
    env:
      # e.g. latest-amd64 — overwritten on every push, never accumulates.
      PLATFORM_TAG: ${{ github.ref_name }}-${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.emulate
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Build image
        run: |
          dest="${REGISTRY}/${IMAGE}:${PLATFORM_TAG}"
          echo "Building ${dest} for ${PLATFORM}"
          # --identity-label keeps concurrent matrix builds from clobbering
          # each other's cached layers in the runner's shared storage.
          podman build --platform "${PLATFORM}" --timestamp 0 --identity-label -t "${dest}" .

      - name: Push per-platform image
        run: |
          podman login "${REGISTRY}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          podman push "${REGISTRY}/${IMAGE}:${PLATFORM_TAG}"

  merge-manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create and push manifest list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman login "${REGISTRY}" -u "${{ github.actor }}" -p "${GITHUB_TOKEN}"
          repo="${REGISTRY}/${IMAGE}"

          # One list per final tag, both assembled from the per-platform refs.
          for tag in "${GITHUB_REF_NAME}" "sha-${GITHUB_SHA}"; do
            list="multiarch-${tag}"
            podman manifest create "localhost/${list}"
            for plat in amd64 arm64 riscv64; do
              podman manifest add "localhost/${list}" "docker://${repo}:${GITHUB_REF_NAME}-${plat}"
            done
            podman manifest push --all "localhost/${list}" "docker://${repo}:${tag}"
            podman manifest rm "localhost/${list}"
          done
