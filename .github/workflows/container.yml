name: Container

on:
  push:
    branches: ["main", "latest"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tag with the branch name (main / latest); also keep a commit SHA tag.
      - name: Compute image name and tags
        id: meta
        run: |
          repo_lower="${GITHUB_REPOSITORY,,}"
          echo "name=${repo_lower}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${GITHUB_REF_NAME}"
            echo "sha-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ steps.meta.outputs.name }}
          tags: ${{ steps.meta.outputs.tags }}
          containerfiles: |
            ./Containerfile

      - name: Push to GHCR
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image digest
        run: echo "Pushed ${{ steps.push.outputs.registry-path }}@${{ steps.push.outputs.digest }}"
