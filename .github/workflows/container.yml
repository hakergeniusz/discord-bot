name: Container

on:
  push:
    branches: ["main", "latest"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners where available; riscv64 rides QEMU emulation.
          # riscv64 builds cffi/pynacl/cryptography from source; needs longer.
          - platform: linux/amd64
            runs-on: ubuntu-latest
            emulate: false
            timeout: 60
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            emulate: false
            timeout: 60
          - platform: linux/riscv64
            runs-on: ubuntu-latest
            emulate: true
            timeout: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.emulate
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      # e.g. image=ghcr.io/hakergeniusz/discord-bot, ptag=latest-linux-amd64.
      # GHCR needs a lowercase full path; tags cannot contain "/".
      - name: Compute image reference
        id: meta
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          ptag="${GITHUB_REF_NAME}-${PLATFORM//\//-}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "ptag=${ptag}" >> "$GITHUB_OUTPUT"
          echo "Building ${image}:${ptag} for ${PLATFORM}"

      - name: Build image
        run: |
          podman build --platform "${PLATFORM}" --timestamp 0 \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ptag }}" .
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Push per-platform image
        run: |
          podman login "${REGISTRY}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          podman push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ptag }}"

  merge-manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create and push manifest list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman login "${REGISTRY}" -u "${{ github.actor }}" -p "${GITHUB_TOKEN}"
          repo="${REGISTRY}/${GITHUB_REPOSITORY,,}"

          # One list per final tag, assembled from the per-platform refs.
          for tag in "${GITHUB_REF_NAME}"; do
            list="multiarch-${tag//\//-}"
            podman manifest create "localhost/${list}"
            for plat in linux-amd64 linux-arm64 linux-riscv64; do
              podman manifest add "localhost/${list}" "docker://${repo}:${tag}-${plat}"
            done
            podman manifest push --all "localhost/${list}" "docker://${repo}:${tag}"
            podman manifest rm "localhost/${list}"
          done

  ci-issue:
    name: File CI-failure issue
    needs: [build, merge-manifest]
    if: ${{ !cancelled() && failure() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/latest') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the CI-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --json number,title --jq '.[] | select(.title == "🔴 Container failing on ${GITHUB_REF_NAME}") | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" \
              --body "Still failing — [run #${{ github.run_id }}](${RUN_URL}) on \`${GITHUB_SHA::7}\`."
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "🔴 Container failing on ${GITHUB_REF_NAME}" \
              --body "The container build is red on \`${GITHUB_REF_NAME}\`: [run #${{ github.run_id }}](${RUN_URL}) (commit \`${GITHUB_SHA::7}\`)."
          fi

  ci-issue-close:
    name: Close CI-failure issue when green
    needs: [build, merge-manifest]
    if: ${{ !cancelled() && success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/latest') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the CI-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --json number,title --jq '.[] | select(.title == "🔴 Container failing on ${GITHUB_REF_NAME}") | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue close "$number" -R "$GITHUB_REPOSITORY" \
              --comment "Container builds are green again — [run #${{ github.run_id }}](${RUN_URL})."
          fi
