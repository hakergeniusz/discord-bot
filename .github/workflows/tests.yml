name: CI

on:
  push:
    branches: ["main", "latest"]
  pull_request:
    branches: ["main", "latest"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests (including startup check)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          uv run pytest

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests (including startup check)
        run: |
          $env:PYTHONPATH = "$env:PYTHONPATH;$(Get-Location)/src"
          uv run pytest

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests (including startup check)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          uv run pytest

  ci-issue:
    name: File CI-failure issue
    needs: [lint, test-linux, test-windows, test-macos]
    if: ${{ !cancelled() && failure() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/latest') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the CI-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --json number,title --jq '.[] | select(.title == "🔴 CI failing on ${GITHUB_REF_NAME}") | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" \
              --body "Still failing — [run #${{ github.run_id }}](${RUN_URL}) on \`${GITHUB_SHA::7}\`."
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "🔴 CI failing on ${GITHUB_REF_NAME}" \
              --body "CI is red on \`${GITHUB_REF_NAME}\`: [run #${{ github.run_id }}](${RUN_URL}) (commit \`${GITHUB_SHA::7}\`)."
          fi

  ci-issue-close:
    name: Close CI-failure issue when green
    needs: [lint, test-linux, test-windows, test-macos]
    if: ${{ !cancelled() && success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/latest') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the CI-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --json number,title --jq '.[] | select(.title == "🔴 CI failing on ${GITHUB_REF_NAME}") | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue close "$number" -R "$GITHUB_REPOSITORY" \
              --comment "CI is green again — [run #${{ github.run_id }}](${RUN_URL})."
          fi
