[project]
name = "discord-bot"
version = "2.1.0"
description = "Yet Another Shitly Made Discord Bot."
license = "EUPL-1.2"
readme = "docs/README.md"
requires-python = ">=3.14"
dependencies = [
	"discord-py>=2.6.4",
    "discord-py[voice]>=2.6.4",
    "google-genai>=1.62.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "yt-dlp>=2026.2.4",
]


[tool.basedpyright]
typeCheckingMode = "standard"
reportOptionalMemberAccess = false
reportFunctionMemberAccess = false

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[project.scripts]
bot = "main:main"

[tool.uv]
package = true
# Override discord-py's PyNaCl<1.6 pin so Dependabot fix (CVE-2025-69277,
# needs PyNaCl>=1.6.2) can be installed. Voice only uses nacl.secret /
# nacl.utils, whose API is stable across 1.5 -> 1.6.
override-dependencies = ["pynacl>=1.6.2"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

## --- RUFF ---
[tool.ruff]
target-version = "py314" #  3.14159265359!
extend-exclude = [
    "*.py.example",
]
line-length = 100
preview = true  # required for missing-copyright-notice (mandatory file header)

[tool.ruff.lint]
select = ["ALL", "missing-copyright-notice"]
# Ignore specific rules if needed
ignore = [
    "assert", # Allow assert
    "hardcoded-temp-file", # Allow usage of /tmp/
    "too-many-return-statements", # Too many return statements
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["magic-value-comparison"]

[tool.ruff.lint.flake8-copyright]
# Mandatory EUPL copyright + license header on every Python file (CPY001 is preview-only).
author = "hakergeniusz"
# Custom notice pattern: the default regex requires numeric years (YYYY-YYYY),
# but the project uses "2025-present" so the year never needs bumping.
# NOTE: the pattern must end BEFORE the author name - Ruff requires the
# configured `author` to immediately follow the regex match.
notice-rgx = "(?i)copyright \\(c\\) 2025-present"
